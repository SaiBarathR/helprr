name: CI

on:
  push:
    branches: [development, main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-migration-password
          POSTGRES_DB: helprr_migration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d helprr_migration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          # The checked-out commit's parent, for the whitespace check.
          fetch-depth: 2

      # A pull request checks out its merge commit, whose first parent is the
      # base branch, so this checks the whole change (on a push, the merge).
      - name: Check whitespace errors and conflict markers
        run: git diff --check HEAD^1 HEAD

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Validate Prisma schema
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Test upgrades from released database snapshots
        run: npm run test:migrations
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://postgres:ci-migration-password@localhost:5432/helprr_migration_test

      - name: Build
        run: npm run build
        env:
          # Dummy values — nothing connects during a build, but env validation
          # and any statically-collected route must not fail on missing config.
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          REDIS_URL: redis://localhost:6379
          REDIS_PASSWORD: ci-dummy-password
          APP_PASSWORD: ci-dummy-password
          JWT_SECRET: ci-dummy-jwt-secret-at-least-32-characters-long

  # PR-time image scan: builds the amd64 image without pushing and runs the
  # same pinned, blocking Trivy gate that guards publishes, so vulnerabilities
  # surface at review time instead of at the first post-merge image build.
  # (Publishes still scan both native platforms in docker-publish.yml.)
  image-scan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      # Both Compose scopes, each with its own env file and never layered. The
      # env files hold throwaway secrets that setup-env.sh never prints, and
      # --quiet renders nothing on success.
      - name: Validate Compose files
        run: |
          trap 'rm -f .env .env.dev' EXIT
          sh scripts/setup-env.sh --stable
          sh scripts/setup-env.sh --dev
          docker compose --env-file .env -f docker-compose.yml config --quiet
          docker compose --env-file .env.dev -f docker-compose.dev.yml config --quiet

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (amd64, not pushed)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: helprr-pr-scan:local
          # Read the publish workflow's build cache for this platform; the PR
          # scan never writes cache so it cannot churn the publish cache.
          cache-from: type=gha,scope=linux-amd64

      # Boots the built image the way the stable Compose file runs it, with its
      # own database and Redis, and waits until it is healthy and ready, so an
      # image that fails at startup is caught before it is published.
      - name: Smoke-test the image with the stable Compose file
        run: |
          trap 'docker compose --env-file .env -f docker-compose.yml down -v >/dev/null 2>&1 || true; rm -f .env' EXIT
          sh scripts/setup-env.sh --stable
          docker tag helprr-pr-scan:local ghcr.io/saibarathr/helprr:ci-smoke
          HELPRR_VERSION=ci-smoke docker compose --env-file .env -f docker-compose.yml up -d --quiet-pull
          # Exactly 200 (a redirect is not ready), each request capped, and two
          # minutes in all per endpoint.
          for path in /api/health /api/ready; do
            deadline=$((SECONDS + 120))
            until [ "$(curl -s -o /dev/null -w '%{http_code}' --connect-timeout 2 --max-time 5 "http://127.0.0.1:3050$path")" = 200 ]; do
              if [ "$SECONDS" -ge "$deadline" ]; then
                echo "$path did not return 200 within two minutes"
                docker compose --env-file .env -f docker-compose.yml logs --no-color --tail=100 helprr
                exit 1
              fi
              sleep 2
            done
            echo "$path returned 200"
          done

      - name: Scan image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_EXIT_ON_EOL: '1'
        with:
          version: v0.70.0
          image-ref: helprr-pr-scan:local
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          timeout: 10m0s
