# The guides (docs-site/, Astro Starlight): built and link-checked on every pull request
# that touches them; published to GitHub Pages only from main, which changes only with a
# release. Publishing also waits for the repository variable DOCS_PAGES_ENABLED=true, set
# when Pages is turned on, so nothing goes live before the owner approves it.
name: Docs

on:
  pull_request:
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
      # The install configurator builds on it.
      - 'docker-compose.yml'
  push:
    branches: [main]
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs.yml'
      # The install configurator builds on it.
      - 'docker-compose.yml'
  workflow_dispatch:

permissions:
  contents: read

# A newer pull request push replaces the older build; a publish from main always finishes.
concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: docs-site
    steps:
      # No token left on disk while third-party build code runs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build and check links
        run: npm run build

      # Every answer the install configurator accepts gives a valid Compose file.
      - name: Check the install configurator
        run: node scripts/check-configurator.mjs

      - name: Check the CasaOS and Runtipi files
        run: node scripts/check-app-stores.mjs

      - name: Keep the built site for publishing
        if: github.ref == 'refs/heads/main' && vars.DOCS_PAGES_ENABLED == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-site/dist

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.DOCS_PAGES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
