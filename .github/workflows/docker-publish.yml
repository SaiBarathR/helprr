name: Docker publish

on:
  push:
    branches: [development]
    tags: ['v*.*.*']

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

# Each platform builds natively (no QEMU — Node's JIT crashes/hangs under
# arm64 emulation) and pushes by digest; the merge job assembles the
# multi-arch manifest and applies the tags.
jobs:
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            image: ghcr.io/saibarathr/helprr
            dockerfile: Dockerfile
            slug: app
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/saibarathr/helprr
            dockerfile: Dockerfile
            slug: app
          - platform: linux/amd64
            runner: ubuntu-latest
            image: ghcr.io/saibarathr/helprr-twitch-worker
            dockerfile: docker/twitch-worker.Dockerfile
            slug: twitch-worker
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            image: ghcr.io/saibarathr/helprr-twitch-worker
            dockerfile: docker/twitch-worker.Dockerfile
            slug: twitch-worker
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      IMAGE: ${{ matrix.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Prepare platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}

      # VAPID keys are intentionally not passed: every installation injects its
      # own key pair at runtime, so published images contain no shared key.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.slug == 'app' && env.PLATFORM_PAIR || format('{0}-{1}', matrix.slug, env.PLATFORM_PAIR) }}
          cache-to: type=gha,mode=max,scope=${{ matrix.slug == 'app' && env.PLATFORM_PAIR || format('{0}-{1}', matrix.slug, env.PLATFORM_PAIR) }}

      # Scan each native runtime image before its digest is exported to the
      # manifest job. A finding therefore blocks edge/version tags for both
      # architectures. Pin the action by commit after the 2026 Trivy ecosystem
      # incident; the comment records the corresponding immutable release.
      - name: Scan image for fixable high/critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_EXIT_ON_EOL: '1'
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          version: v0.70.0
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: '1'
          timeout: 10m0s

      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.slug }}-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    strategy:
      matrix:
        include:
          - image: ghcr.io/saibarathr/helprr
            slug: app
          - image: ghcr.io/saibarathr/helprr-twitch-worker
            slug: twitch-worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: ${{ matrix.image }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digests-${{ matrix.slug }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tag strategy:
      #   push to development      -> edge
      #   tag v1.2.3               -> 1.2.3 only until that exact image passes
      #                                 the production smoke check
      #   tag v1.0.0-rc.1          -> 1.0.0-rc.1 only (no channel tags)
      # After qualification, the exact digest is manually promoted to the
      # minor, major, and stable aliases. No `latest` tag on purpose.
      - name: Docker metadata (tags)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/development' }}
            type=semver,pattern={{version}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "$IMAGE@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "$IMAGE:${{ steps.meta.outputs.version }}"

  # On version tags, draft a GitHub release carrying every file needed for a
  # no-clone install and pre-upgrade backup. Draft on purpose: finalize notes
  # from CHANGELOG.md before publishing.
  release:
    needs: merge
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Draft release with deployment assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Re-running the workflow on an existing tag must not fail the job —
          # the draft (or published release) already exists; leave it alone.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists — skipping draft creation."
            exit 0
          fi
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in
            *-*) prerelease_flag="--prerelease" ;;
          esac
          # GitHub forbids asset names starting with a dot — ship it as env.example.
          cp .env.example env.example
          install -m 0755 scripts/setup-env.sh setup-env.sh
          install -m 0755 scripts/backup.sh backup.sh
          install -m 0755 scripts/update.sh update.sh
          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --generate-notes \
            $prerelease_flag \
            docker-compose.yml env.example setup-env.sh backup.sh update.sh
