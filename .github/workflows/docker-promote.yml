name: Docker promote

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact stable version to promote (for example, 1.0.0)
        required: true
        type: string
      source_digest:
        description: Qualified multi-arch manifest digest (sha256:...)
        required: true
        type: string
      worker_digest:
        description: Qualified helprr-twitch-worker manifest digest (sha256:...)
        required: true
        type: string

env:
  IMAGE: ghcr.io/saibarathr/helprr
  WORKER_IMAGE: ghcr.io/saibarathr/helprr-twitch-worker

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate promotion inputs
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
        run: |
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$SOURCE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$WORKER_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]

          exact_digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" \
            | awk '/^Digest:/ { print $2; exit }')
          test "$exact_digest" = "$SOURCE_DIGEST"
          worker_exact=$(docker buildx imagetools inspect "$WORKER_IMAGE:$VERSION" \
            | awk '/^Digest:/ { print $2; exit }')
          test "$worker_exact" = "$WORKER_DIGEST"

      - name: Promote qualified digest
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_DIGEST: ${{ inputs.source_digest }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          docker buildx imagetools create \
            -t "$IMAGE:$major.$minor" \
            -t "$IMAGE:$major" \
            -t "$IMAGE:stable" \
            "$IMAGE@$SOURCE_DIGEST"

      - name: Promote the Twitch worker to the same aliases
        env:
          VERSION: ${{ inputs.version }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          docker buildx imagetools create \
            -t "$WORKER_IMAGE:$major.$minor" \
            -t "$WORKER_IMAGE:$major" \
            -t "$WORKER_IMAGE:stable" \
            "$WORKER_IMAGE@$WORKER_DIGEST"

      - name: Verify aliases
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_DIGEST: ${{ inputs.source_digest }}
          WORKER_DIGEST: ${{ inputs.worker_digest }}
        run: |
          IFS=. read -r major minor patch <<< "$VERSION"
          for tag in "$VERSION" "$major.$minor" "$major" stable; do
            digest=$(docker buildx imagetools inspect "$IMAGE:$tag" \
              | awk '/^Digest:/ { print $2; exit }')
            echo "$tag -> $digest"
            test "$digest" = "$SOURCE_DIGEST"
            worker=$(docker buildx imagetools inspect "$WORKER_IMAGE:$tag" \
              | awk '/^Digest:/ { print $2; exit }')
            echo "worker $tag -> $worker"
            test "$worker" = "$WORKER_DIGEST"
          done
