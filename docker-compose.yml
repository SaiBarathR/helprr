services:
  helprr-db:
    image: postgres:16-alpine
    container_name: helprr-db
    restart: unless-stopped
    # Empty POSTGRES_PASSWORD: the one helprr-init made. Postgres reads it only when it
    # creates the database, so keep .env once it exists.
    entrypoint:
      - /bin/sh
      - -c
      - |
        [ -n "$$POSTGRES_PASSWORD" ] || POSTGRES_PASSWORD=$$(cat /helprr-auth/postgres_password 2>/dev/null) || true
        [ -n "$$POSTGRES_PASSWORD" ] || { echo 'helprr-db: no POSTGRES_PASSWORD and none generated (helprr-init)' >&2; exit 1; }
        export POSTGRES_PASSWORD
        exec docker-entrypoint.sh "$$@"
      - helprr-db
    command: ["postgres"]
    depends_on:
      helprr-init:
        condition: service_completed_successfully
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - POSTGRES_DB=helprr
    volumes:
      - helprr-db-data:/var/lib/postgresql/data
      - helprr-db-auth:/helprr-auth:ro
    networks:
      - helprr-net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  helprr-redis:
    image: redis:8-alpine
    container_name: helprr-redis
    restart: unless-stopped
    depends_on:
      helprr-init:
        condition: service_completed_successfully
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    # Empty REDIS_PASSWORD: the one helprr-init made.
    command:
      - sh
      - -c
      - |
        [ -n "$$REDIS_PASSWORD" ] || REDIS_PASSWORD=$$(cat /helprr-auth/redis_password 2>/dev/null) || true
        [ -n "$$REDIS_PASSWORD" ] || { echo 'helprr-redis: no REDIS_PASSWORD and none generated (helprr-init)' >&2; exit 1; }
        # From stdin, so the password is not in the process list; quoted for Redis.
        # Through the image's entrypoint, which drops root before starting the server.
        # /data is handed to the redis user here, whole: the entrypoint skips that when
        # it finds a file it does not know, and Redis could then not read its own data.
        chown -R redis /data 2>/dev/null || true
        exec docker-entrypoint.sh redis-server - --appendonly yes <<EOF
        requirepass "$$(printf '%s' "$$REDIS_PASSWORD" | sed 's/[\\"]/\\&/g')"
        EOF
    volumes:
      - helprr-redis-data:/data
      - helprr-redis-auth:/helprr-auth:ro
    networks:
      - helprr-net
    healthcheck:
      test: [ "CMD-SHELL", "[ -n \"$$REDIS_PASSWORD\" ] || REDIS_PASSWORD=$$(cat /helprr-auth/redis_password); REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep -q PONG" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Makes the secrets that .env does not set (docker/init-secrets.sh), once, on the
  # helprr-secrets volume, with a copy for each reader; then exits. A value set in
  # .env always wins. Back the volume up with the database (scripts/backup.sh).
  helprr-init:
    image: ghcr.io/saibarathr/helprr:${HELPRR_VERSION:-stable}
    container_name: helprr-init
    user: "0:0"
    entrypoint: ["/bin/sh", "/app/init-secrets.sh"]
    restart: "no"
    network_mode: none
    # Init only needs to know which values .env sets ("set"), never the values.
    environment:
      - JWT_SECRET=${JWT_SECRET:+set}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:+set}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:+set}
      - REDIS_PASSWORD=${REDIS_PASSWORD:+set}
      - TWITCH_PUID=${TWITCH_PUID:-1000}
      - TWITCH_PGID=${TWITCH_PGID:-1000}
    volumes:
      - helprr-secrets:/secrets
      - helprr-db-auth:/auth/db
      - helprr-redis-auth:/auth/redis
      # Only to give a new backup folder to the app's user.
      - helprr-backups:/app/backups

  helprr:
    # Published image. The default `stable` channel tracks qualified releases;
    # pin an exact version with HELPRR_VERSION (e.g. 1.0.0). Build source only in
    # the standalone isolated development stack; never layer it over this file:
    #   docker compose --env-file .env.dev -f docker-compose.dev.yml up -d --build
    image: ghcr.io/saibarathr/helprr:${HELPRR_VERSION:-stable}
    container_name: helprr
    restart: unless-stopped
    # The app drains in-flight polling/cleanup work for up to 30s on SIGTERM
    # (src/lib/shutdown.ts); give it headroom before Docker SIGKILLs.
    stop_grace_period: 45s
    ports:
      - "${HELPRR_PORT:-3050}:3050"
    depends_on:
      helprr-init:
        condition: service_completed_successfully
      helprr-db:
        condition: service_healthy
      helprr-redis:
        condition: service_healthy
    environment:
      - TZ=${TZ:-UTC}
      - LOG_DIR=${LOG_DIR:-/app/logs}
      # Empty DATABASE_URL: built from POSTGRES_PASSWORD, or from the generated one.
      # If the password contains URL special characters (@ : / ? # etc.), set
      # DATABASE_URL explicitly with the password percent-encoded.
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - REDIS_URL=${REDIS_URL:-redis://helprr-redis:6379}
      # Empty: the one helprr-init made.
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - HELPRR_ADMIN_USERNAME=${HELPRR_ADMIN_USERNAME:-}
      - HELPRR_ADMIN_PASSWORD_RESET=${HELPRR_ADMIN_PASSWORD_RESET:-}
      - TRUST_FORWARDED_PROTO=${TRUST_FORWARDED_PROTO:-}
      - TRUSTED_PROXY_HOPS=${TRUSTED_PROXY_HOPS:-}
      # At least 32 characters. Empty: helprr-init makes one on the helprr-secrets volume.
      - JWT_SECRET=${JWT_SECRET:-}
      # VAPID_PUBLIC_KEY is runtime config (NEXT_PUBLIC_VAPID_PUBLIC_KEY kept as
      # a fallback for .env files from when it was baked in at build time).
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY:-${NEXT_PUBLIC_VAPID_PUBLIC_KEY:-}}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY:-}
      - VAPID_SUBJECT=${VAPID_SUBJECT:-}
      - APP_ORIGIN=${APP_ORIGIN:-}
      - ARR_CALLBACK_ORIGIN=${ARR_CALLBACK_ORIGIN:-}
      - HELPRR_CUSTOM_HEADERS=${HELPRR_CUSTOM_HEADERS:-}
      - EXTRA_ALLOWED_IMAGE_HOSTS=${EXTRA_ALLOWED_IMAGE_HOSTS:-}
      - IMAGE_CACHE_DIR=${IMAGE_CACHE_DIR:-/app/image-cache}
      - IMAGE_CACHE_TTL_SECONDS=${IMAGE_CACHE_TTL_SECONDS:-}
      - IMAGE_CACHE_STALE_SECONDS=${IMAGE_CACHE_STALE_SECONDS:-}
      - IMAGE_CACHE_MAX_BYTES=${IMAGE_CACHE_MAX_BYTES:-}
      - IMAGE_CACHE_MAX_ENTRIES=${IMAGE_CACHE_MAX_ENTRIES:-}
      - IMAGE_UPSTREAM_FETCH_TIMEOUT_MS=${IMAGE_UPSTREAM_FETCH_TIMEOUT_MS:-}
      - IMAGE_UPSTREAM_MAX_BYTES=${IMAGE_UPSTREAM_MAX_BYTES:-}
      - IMAGE_UPSTREAM_MAX_PIXELS=${IMAGE_UPSTREAM_MAX_PIXELS:-}
      - IMAGE_PROCESSING_QUEUE_WAIT_MS=${IMAGE_PROCESSING_QUEUE_WAIT_MS:-}
      - IMAGE_PROCESSING_QUEUE_MAX=${IMAGE_PROCESSING_QUEUE_MAX:-}
      - IMAGE_PROCESSING_QUEUE_PER_USER_MAX=${IMAGE_PROCESSING_QUEUE_PER_USER_MAX:-}
      - IMAGE_FETCH_RATE_BURST=${IMAGE_FETCH_RATE_BURST:-}
      - IMAGE_FETCH_RATE_REFILL_PER_MINUTE=${IMAGE_FETCH_RATE_REFILL_PER_MINUTE:-}
      - IMAGE_QUOTA_LOCK_WAIT_MS=${IMAGE_QUOTA_LOCK_WAIT_MS:-}
      - TMDB_CACHE_DEFAULT_TTL_SECONDS=${TMDB_CACHE_DEFAULT_TTL_SECONDS:-}
      - TMDB_CACHE_DISCOVER_TTL_SECONDS=${TMDB_CACHE_DISCOVER_TTL_SECONDS:-}
      - TMDB_CACHE_DETAILS_TTL_SECONDS=${TMDB_CACHE_DETAILS_TTL_SECONDS:-}
      - TMDB_CACHE_STATIC_TTL_SECONDS=${TMDB_CACHE_STATIC_TTL_SECONDS:-}
      - TMDB_CACHE_STALE_SECONDS=${TMDB_CACHE_STALE_SECONDS:-}
      - CACHE_LOCK_TTL_MS=${CACHE_LOCK_TTL_MS:-}
    volumes:
      - helprr-logs:${LOG_DIR:-/app/logs}
      - helprr-image-cache:/app/image-cache
      # Read-only: the app only reads its copies; helprr-init writes them.
      - helprr-secrets:/app/secrets:ro
      # In-app database backups (Settings -> Backup & Restore); never served over HTTP.
      - helprr-backups:/app/backups
    # Lets an app on the same machine be reached as http://host.docker.internal:<port>.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - helprr-net
    healthcheck:
      # Flags a wedged Node process as unhealthy (restart-on-unhealthy needs an
      # external supervisor like autoheal; plain Docker only reports status).
      test: [ "CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3050/api/health" ]
      interval: 30s
      timeout: 5s
      retries: 3
      # Entrypoint runs `prisma migrate deploy` before the server starts.
      start_period: 60s

  # With the worker only: a library folder that Docker has just created (empty, owned by
  # root, made in the last five minutes) goes to the worker's user, so an install without
  # setup-env.sh can write to it. Any other folder is left alone: a root-owned one gets a
  # hint. Docker follows links in the host path, so never nest one library inside the other.
  helprr-worker-init:
    image: ghcr.io/saibarathr/helprr:${HELPRR_VERSION:-stable}
    container_name: helprr-worker-init
    profiles: ["twitch", "youtube"]
    user: "0:0"
    restart: "no"
    network_mode: none
    depends_on:
      helprr-init:
        condition: service_completed_successfully
    entrypoint:
      - /bin/sh
      - -c
      - |
        for id in "$$TWITCH_PUID" "$$TWITCH_PGID"; do
          case "$$id" in ''|*[!0-9]*) bad=yes ;; *) [ "$$id" -ne 0 ] || bad=yes ;; esac
        done
        [ -z "$${bad:-}" ] || { echo 'worker-init: TWITCH_PUID and TWITCH_PGID must be numbers, and not root (0)' >&2; exit 1; }
        for d in /media/twitch /media/youtube; do
          [ -d "$$d" ] && [ "$$(stat -c %u "$$d")" = 0 ] || continue
          if [ -n "$$(ls -A "$$d")" ] || [ $$(( $$(date +%s) - $$(stat -c %Z "$$d") )) -gt 300 ]; then
            echo "worker-init: $$d belongs to root; give it to $$TWITCH_PUID:$$TWITCH_PGID on the host so the worker can write to it" >&2
            continue
          fi
          if chown "$$TWITCH_PUID:$$TWITCH_PGID" "$$d" && chmod 775 "$$d"; then
            echo "worker-init: $$d now belongs to $$TWITCH_PUID:$$TWITCH_PGID"
          else
            echo "worker-init: could not give $$d to $$TWITCH_PUID:$$TWITCH_PGID (a network share?); the worker reports whether it can write there" >&2
          fi
        done
    environment:
      - TWITCH_PUID=${TWITCH_PUID:-1000}
      - TWITCH_PGID=${TWITCH_PGID:-1000}
    volumes:
      - ${TWITCH_LIBRARY_HOST_PATH:-./twitch-library}:/media/twitch
      - ${YOUTUBE_LIBRARY_HOST_PATH:-/dev/null}:/media/youtube

  # Optional, and off unless COMPOSE_PROFILES has twitch or youtube: the only process
  # that runs yt-dlp, TwitchDownloaderCLI and ffmpeg, or writes the libraries.
  helprr-twitch-worker:
    image: ghcr.io/saibarathr/helprr-twitch-worker:${HELPRR_VERSION:-stable}
    container_name: helprr-twitch-worker
    profiles: ["twitch", "youtube"]
    restart: unless-stopped
    stop_grace_period: 60s
    user: "${TWITCH_PUID:-1000}:${TWITCH_PGID:-1000}"
    group_add:
      - "${TWITCH_RENDER_GID:-992}"
    # The GPU is optional: a bind mount (not `devices:`) starts even on a host without
    # /dev/dri, and the cgroup rule lets ffmpeg open DRM nodes (major 226) when they
    # exist. Without them the worker reports "No GPU" and re-encoding stays idle. On an
    # SELinux host, `setsebool -P container_use_devices 1` lets the worker use the GPU.
    device_cgroup_rules:
      - "c 226:* rw"
    depends_on:
      helprr-init:
        condition: service_completed_successfully
      helprr-worker-init:
        condition: service_completed_successfully
      helprr-db:
        condition: service_healthy
    environment:
      - TZ=${TZ:-UTC}
      # Same order as the app: DATABASE_URL, POSTGRES_PASSWORD, the generated one.
      - DATABASE_URL=${DATABASE_URL:-}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-}
      - APP_PASSWORD=${APP_PASSWORD:-}
      - TWITCH_LIBRARY_DIR=/media/twitch
      - YOUTUBE_LIBRARY_DIR=/media/youtube
      - TWITCH_TOOLS_DIR=/data/tools
    volumes:
      # The GPU when there is one; see device_cgroup_rules. Never add :z or :Z here: that
      # would relabel the host's /dev/dri under SELinux.
      - /dev/dri:/dev/dri:ro
      - ${TWITCH_LIBRARY_HOST_PATH:-./twitch-library}:/media/twitch
      # /dev/null means no folder was chosen: nothing is created, and YouTube reports not ready.
      - ${YOUTUBE_LIBRARY_HOST_PATH:-/dev/null}:/media/youtube
      - helprr-twitch-tools:/data/tools
      - helprr-secrets:/secrets:ro
    networks:
      - helprr-net

networks:
  helprr-net:
    driver: bridge

volumes:
  helprr-twitch-tools:
  helprr-db-data:
  helprr-image-cache:
    name: helprr-image-cache
  # Generated secrets: losing it ends every session and makes stored tokens unreadable.
  helprr-secrets:
    name: helprr-secrets
  # In-app database backups. Copy them off the server too; see the backup guide.
  helprr-backups:
    name: helprr-backups
  # Root-only copies of the database and Redis passwords, rewritten by helprr-init.
  helprr-db-auth:
  helprr-redis-auth:
  helprr-logs:
  helprr-redis-data:
